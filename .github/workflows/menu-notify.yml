name: 식단 알림

on:
  # cron은 UTC 기준입니다. KST = UTC + 9시간.
  # 아래 식을 바꾸면 main.py 의 CRON_TO_MODE 도 똑같이 바꿔야 합니다.
  schedule:
    # 매시 정각/30분은 예약 실행이 몰려 지연이 심해서, 원하는 시각보다 조금 이르게 잡았습니다.
    - cron: "50 22 * * 0-4" # KST 월~금 07:50 → 중식+석식 미리보기 (UTC로는 전날 일~목 22:50)
    - cron: "50 1 * * 1-5" # KST 월~금 10:50 → 중식
    - cron: "20 7 * * 1-5" # KST 월~금 16:20 → 석식
  # Actions 탭에서 수동 실행 (테스트용)
  workflow_dispatch:
    inputs:
      mode:
        description: "알림 종류"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - lunch
          - dinner

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 식단 알림 보내기
        env:
          # Secrets는 여기서 환경변수로만 전달합니다. 코드나 로그에 직접 쓰지 않습니다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 수동 실행이면 MODE에 값이 있고, 스케줄 실행이면 CRON에 값이 있습니다.
          MODE: ${{ inputs.mode }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ -n "$MODE" ]; then
            python main.py --mode "$MODE"
          else
            python main.py --cron "$CRON"
          fi
